<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Boulevard Hotel Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Private presentation for Howard Group: HWE’s broker selection proposal, sales strategy and Broker’s Opinion of Value for the Courtyard, Residence Inn and Hyatt Place at Grand Boulevard Sandestin.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#11163A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;0,700;1,700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/deck.css?v=75">
<link rel="stylesheet" href="assets/css/pages.css?v=75">
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<main id="stage" aria-label="Presentation">
  <div id="deck" aria-roledescription="slide deck"></div>
</main>
<nav id="ui" aria-label="Presentation controls">
  <div class="grp">
    <button id="prev" type="button" aria-label="Previous slide"><svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M13 5H1m0 0l4-4M1 5l4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span class="kb">Prev</span></button>
    <button id="next" type="button" aria-label="Next slide"><span class="kb">Next</span><svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M1 5h12m0 0L9 1m4 4L9 9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <span class="chap" id="chapLbl" aria-hidden="true"></span>
  </div>
  <div class="grp">
    <span class="ct" id="count" aria-hidden="true">1 / 1</span>
    <button id="ovBtn" type="button" aria-haspopup="dialog">Slides<span class="kb"> (G)</span></button>
    <button id="fsBtn" type="button" hidden>Full screen<span class="kb"> (F)</span></button>
  </div>
</nav>
<div id="hint" role="note">Use ← → or swipe to move · G for all slides · F for full screen</div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<dialog id="ov" aria-labelledby="ovTitle">
  <div class="top">
    <h2 id="ovTitle">All slides</h2>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <button class="xbtn" type="button" id="ovClose">Close (Esc)</button>
    </div>
  </div>
  <div id="ovBody"></div>
</dialog>

<dialog id="detail" aria-labelledby="dTitle">
  <div class="dh"><div><p class="eb" id="dEb"></p><h2 id="dTitle"></h2><div id="dTags" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"></div></div>
    <button class="xbtn" type="button" id="dClose">Close (Esc)</button></div>
  <div class="db" id="dBody" tabindex="0"></div>
</dialog>

<dialog id="lb" aria-label="Photo viewer">
  <span class="ct" id="lbCount"></span>
  <div class="stg"><img id="lbImg" alt=""></div>
  <p class="cap" id="lbCap"></p>
  <button class="ib x" type="button" id="lbClose" aria-label="Close photo viewer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="ib pv" type="button" id="lbPrev" aria-label="Previous photo"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  <button class="ib nx" type="button" id="lbNext" aria-label="Next photo"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
</dialog>
<dialog id="logoPop" aria-labelledby="lpName">
  <div class="lp-card"><p class="lp-grp" id="lpGrp"></p><div class="lp-stage"><img id="lpImg" alt=""></div><h3 id="lpName"></h3></div>
  <button class="ib x" type="button" id="lpClose" aria-label="Close logo viewer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="ib pv" type="button" id="lpPrev" aria-label="Previous logo"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  <button class="ib nx" type="button" id="lpNext" aria-label="Next logo"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
</dialog>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script src="assets/js/data.js?v=75"></script>
<script src="assets/js/tables.js?v=75"></script>
<script src="assets/js/charts.js?v=75"></script>
<script src="assets/js/deck.js?v=75"></script>
</body>
</html>
